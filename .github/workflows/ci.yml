name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*'] # Release workflow handles tag builds; CI only runs on branch push
  pull_request:
    branches: [main]

concurrency:
  # Unique per event (PR number or push SHA) so simultaneous main+tag pushes
  # from the same commit don't cancel each other and produce 0s failures.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint GitHub Actions
        uses: docker://rhysd/actionlint:1.7.12

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Verify self-host security contracts
        run: pnpm test:self-host && pnpm test:installers

      - name: Build, type check, and test
        run: pnpm test:capabilities && pnpm lint && pnpm build && pnpm typecheck && pnpm test

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agentra
          POSTGRES_USER: agentra
          POSTGRES_PASSWORD: agentra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentra -d agentra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://agentra:agentra@localhost:5432/agentra?sslmode=disable
      TEST_DATABASE_URL: postgres://agentra:agentra@localhost:5432/agentra?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: server/go.sum

      - name: Build
        run: cd server && go build ./...

      - name: Run migrations
        run: cd server && go run ./cmd/migrate up

      - name: Test
        run: cd server && go test ./...

  installers:
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build native CLI
        run: go build ./cmd/agentra
        working-directory: server

      - name: Test Unix installer
        if: runner.os != 'Windows'
        run: bash scripts/test-installers.sh

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-installers.ps1
