name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mkdocs-material==9.5.31

      - name: Build English site
        run: |
          cp -r docs/en/* docs/
          mkdocs build --strict --site-dir _site

      - name: Build Chinese site
        env:
          PYTHONUTF8: 1
        run: |
          git checkout docs/
          sed -i 's/language: en/language: zh/' mkdocs.yml
          cp -r docs/zh/* docs/
          mkdocs build --strict --site-dir _site_zh

      - name: Prepare artifact
        run: |
          mkdir site
          cp -r _site/* site/
          mkdir -p site/zh
          cp -r _site_zh/* site/zh/
          rm -rf _site _site_zh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
