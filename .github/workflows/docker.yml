name: Container Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/agentra

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [server-runtime, web-runtime]
        include:
          - target: server-runtime
            component: server
            build-args: ""
          - target: web-runtime
            component: web
            build-args: REMOTE_API_URL=http://server:8080
    steps:
      - uses: actions/checkout@v6

      - name: Validate release metadata
        id: release-metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node scripts/release_metadata.mjs --version --tag "$RELEASE_TAG")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # .env is gitignored (see .gitignore .env*); create a stub for the
      # web build stage which expects to find it at apps/web/.env.
      - name: Create .env stub for CI
        run: |
          cp .env.example .env 2>/dev/null || touch .env

      - uses: docker/setup-buildx-action@v3

      - name: Setup Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=${{ matrix.component }}-v{{version}}
            type=semver,pattern=${{ matrix.component }}-v{{major}}.{{minor}}
            type=raw,value=${{ matrix.component }}-latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release-metadata.outputs.version }}
            COMMIT=${{ github.sha }}
            ${{ matrix.build-args }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${IMAGE_DIGEST}"

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
