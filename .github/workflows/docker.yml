name: Docker Hub

on:
  push:
    tags:
      - "v*"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE: dougzeng/agentra

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [server-runtime, gateway-runtime, web-runtime]
        include:
          - target: server-runtime
            component: server
            build-args: VERSION=${{ github.ref_name }}
          - target: gateway-runtime
            component: gateway
            build-args: VERSION=${{ github.ref_name }}
          - target: web-runtime
            component: web
            build-args: REMOTE_API_URL=http://server:8080
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ matrix.component }}-{{version}}
            type=raw,value=${{ matrix.component }}-{{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
