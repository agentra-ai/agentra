<!DOCTYPE html>
<html lang="en">
<head>

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    h1 {

      padding: 12px 24px;
      background: #6366f1;
      color: white;
      text-decoration: none;

    }

    <h1>404</h1>
