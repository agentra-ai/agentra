site_name: Agenttra
site_description: AI-Native Task Management Platform - Turn coding agents into real teammates
site_author: Agenttra Team

repo_name: agentra-ai/agentra
repo_url: https://github.com/agentra-ai/agentra

theme:
  name: material
  language: en
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - navigation.instant
    - navigation.top
    - navigation.lang

nav:
  - Home: index.md
  - en/
  - zh/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agentra-ai/agentra
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/agenttra
  generator: false

plugins:
  - search:
      lang:
        - en
        - zh
