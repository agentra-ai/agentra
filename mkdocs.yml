site_name: Agenttra
site_description: AI-Native Task Management Platform - Turn coding agents into real teammates
site_author: Agenttra Team
site_url: https://agentra-ai.github.io/agentra

repo_name: agentra-ai/agentra
repo_url: https://github.com/agentra-ai/agentra
edit_url: https://github.com/agentra-ai/agentra/edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

nav:
  - Home: index.md
  - Quick Start: getting-started.md
  - Self-Hosting: self-hosting.md
  - CLI Reference: cli.md
  - Contributing: contributing.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agentra-ai/agentra
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/agenttra

plugins:
  - search
