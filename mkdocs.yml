site_name: Agenttra
site_description: AI-Native Task Management Platform
site_author: Agenttra Team

repo_name: agentra-ai/agentra
repo_url: https://github.com/agentra-ai/agentra

theme:
  name: material
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - navigation.top
    - navigation.lang

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agentra-ai/agentra
  generator: false

# Top-level nav is shared across all languages; the i18n plugin merges it
# with each language's own nav below. Root-level docs (ROADMAP, architecture/,
# spec/, superpowers/) are served identically in every language.
nav:
  - Home: index.md
  - Quick Start: getting-started.md
  - Self-Hosting:
      - getting-started.md  # default cross-ref; actual file in each lang folder
      - self-hosting.md
      - Auto-Upgrade: self-hosting/auto-upgrade.md
  - CLI Reference: cli.md
  - Architecture:
      - Polymorphic Assignee: architecture/polymorphic-assignee.md
      - Agent Conventions: spec/agent-conventions.md
      - Telemetry Metrics: spec/agent-task-metrics.md
  - Blog:
      - Why Polymorphic Assignee: blog/draft-why-polymorphic-assignee.md
      - Auto-Upgrade Demo: blog/demo-auto-upgrade-storyboard.md
  - Roadmap: ROADMAP.md
  - Contributing: contributing.md

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
          nav:
            - Home: index.md
            - Quick Start: getting-started.md
            - Self-Hosting: self-hosting.md
            - CLI Reference: cli.md
            - Contributing: contributing.md
        - locale: zh
          name: 中文
          build: true
          nav:
            - Home: index.md
            - Quick Start: getting-started.md
            - Self-Hosting: self-hosting.md
            - CLI Reference: cli.md
            - Contributing: contributing.md
